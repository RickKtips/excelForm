<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Form</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>
<body>
    <h1>Add New Line to Excel</h1>
    <form id="excel-form" novalidate>
        <label for="excel-file">Upload Excel File (.xlsx):</label>
        <input type="file" id="excel-file" name="excel-file" accept=".xlsx">
        <span class="error-message" id="file-error"></span>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <span class="error-message"></span>

        <label for="url">URL:</label>
        <input type="text" id="url" name="url" required>
        <span class="error-message"></span>

        <label for="mensagem">Mensagem:</label>
        <input type="text" id="mensagem" name="mensagem" required>
        <span class="error-message"></span>

        <label for="zoom">Zoom:</label>
        <input type="number" id="zoom" name="zoom" required>
        <span class="error-message"></span>

        <label for="url_teams">URL Teams:</label>
        <input type="text" id="url_teams" name="url_teams" required>
        <span class="error-message"></span>

        <label for="resolucao_tela">Resolução da Tela:</label>
        <input type="text" id="resolucao_tela" name="resolucao_tela" required>
        <span class="error-message"></span>

        <label for="frequencia_tipo">Frequência Tipo:</label>
        <select id="frequencia_tipo" name="frequencia_tipo" required>
            <option value="">--Please choose an option--</option>
            <option value="recorrent">Recorrent</option>
            <option value="constant">Constant</option>
        </select>
        <span class="error-message"></span>

        <div id="time-fields">
            <label>Times:</label>
            <div class="time-input">
                <input type="time" name="times[]">
                <div class="days-of-week">
                    <input type="checkbox" value="SEG" name="days-0[]">SEG
                    <input type="checkbox" value="TER" name="days-0[]">TER
                    <input type="checkbox" value="QUA" name="days-0[]">QUA
                    <input type="checkbox" value="QUI" name="days-0[]">QUI
                    <input type="checkbox" value="SEX" name="days-0[]">SEX
                    <input type="checkbox" value="SAB" name="days-0[]">SAB
                    <input type="checkbox" value="TODOS" name="days-0[]">TODOS
                </div>
                <span class="error-message"></span>
            </div>
        </div>
        <button type="button" id="add-time">Add Time</button>

        <button type="button" id="new-button">New</button>
        <button type="submit">Download</button>
    </form>

    <table id="data-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>URL</th>
                <th>Mensagem</th>
                <th>Zoom</th>
                <th>URL Teams</th>
                <th>Resolução da Tela</th>
                <th>Frequência Tipo</th>
                <th>Times</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="dist/index.js"></script>
</body>
</html>
