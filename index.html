<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Form</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>
<body>
    <h1>Add New Line to Excel</h1>
    <form id="excel-form">
        <label for="excel-file">Upload Excel File (.xlsx):</label>
        <input type="file" id="excel-file" name="excel-file" accept=".xlsx" required>

        <label for="field1">Field 1:</label>
        <input type="text" id="field1" name="field1" required>

        <label for="field2">Field 2:</label>
        <input type="text" id="field2" name="field2" required>

        <label for="field3">Field 3:</label>
        <input type="text" id="field3" name="field3" required>

        <label for="field4">Field 4:</label>
        <input type="text" id="field4" name="field4" required>

        <label for="field5">Field 5:</label>
        <input type="text" id="field5" name="field5" required>

        <label for="select-field">Select Field:</label>
        <select id="select-field" name="select-field" required>
            <option value="">--Please choose an option--</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>

        <label for="number-field">Number Field:</label>
        <input type="number" id="number-field" name="number-field" required>

        <div id="time-fields">
            <label>Time Fields:</label>
            <div class="time-input">
                <input type="time" name="times[]">
            </div>
        </div>
        <button type="button" id="add-time">Add Time</button>

        <button type="submit">Submit</button>
    </form>
    <script src="dist/index.js"></script>
</body>
</html>
